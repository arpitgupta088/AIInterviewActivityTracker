<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Tracker Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>AI Interview Activity Tracker</h2>
    <p>Open Developer Tools (F12) and monitor the Console / Network Tab.</p>

    <!-- Testing Buttons -->
    <button id="btnCustom">Track Custom Event</button>
    <button id="btnMic">Toggle Mic</button>
    <button id="btnCam">Toggle Camera</button>

    <script type="module">
        import ActivityTracker from "./tracker.js";

        const API_BASE_URL = "https://localhost:7026";

        ActivityTracker.init(
            API_BASE_URL,
            "SESSION-TEST-001",
            "CANDIDATE-TEST-001"
        );

        // 1. Custom Button
        document.getElementById("btnCustom").addEventListener("click", () => {
            ActivityTracker.trackEvent(
                "BUTTON_CLICK",
                "TEST_MODULE",
                { button: "customEventButton" }
            );
        });

        // 2. Mic Button
        document.getElementById("btnMic").addEventListener("click", () => {
            ActivityTracker.trackEvent(
                "MIC_TOGGLED",
                "AUDIO_MODULE",
                { isMuted: true }
            );
        });

        // 3. Camera Button
        document.getElementById("btnCam").addEventListener("click", () => {
            ActivityTracker.trackEvent(
                "CAMERA_TOGGLED",
                "VIDEO_MODULE",
                { isEnabled: false }
            );
        });
    </script>

</body>
</html>
